name: ARES Telegram Runtime

on:
  workflow_dispatch:

# ARES runs only when explicitly started with workflow_dispatch.
# Code pushes and scheduled events never start or replace the runtime.
concurrency:
  group: ares-runtime-v2
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write
  actions: write

jobs:
  telegram-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      ARES_RUNTIME_MINUTES: "340"
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout ARES
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stop previous ARES runtime on manual start
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 2
        uses: actions/github-script@v7
        with:
          script: |
            const statuses = ["in_progress", "pending", "queued"];
            const responses = await Promise.all(statuses.map((status) =>
              github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ares-runtime.yml",
                status,
                per_page: 100
              })
            ));
            const byId = new Map();
            for (const response of responses) {
              for (const run of response.data.workflow_runs) {
                if (run.id !== context.runId) byId.set(run.id, run);
              }
            }
            const previous = Array.from(byId.values());
            for (const run of previous) {
              core.info(`Cancelling previous ARES run ${run.id} on ${run.head_branch}`);
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
            }
            for (const run of previous) {
              let completed = false;
              for (let attempt = 0; attempt < 30; attempt += 1) {
                const status = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                if (status.data.status === "completed") {
                  completed = true;
                  break;
                }
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }
              if (!completed) {
                throw new Error(`Previous ARES worker ${run.id} did not stop in time; refusing to launch a duplicate.`);
              }
            }

      - name: Locate previous runtime snapshot
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            let selectedRun = null;
            let hasPreviousRuntime = false;
            const retentionCutoff = Date.now() - 31 * 24 * 60 * 60 * 1000;

            for (let page = 1; page <= 20 && !selectedRun; page += 1) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ares-runtime.yml",
                status: "completed",
                per_page: 100,
                page
              });
              const previousRuns = runs.data.workflow_runs
                .filter((run) => run.id !== context.runId)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));

              if (page === 1) hasPreviousRuntime = previousRuns.length > 0;

              for (const run of previousRuns) {
                const response = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100
                });
                const artifact = response.data.artifacts.find((item) =>
                  item.name === "ares-strix-state" &&
                  item.expired === false &&
                  item.size_in_bytes > 0
                );
                if (artifact) {
                  selectedRun = run;
                  core.info(`Using encrypted Strix history from completed runtime ${run.id}.`);
                  break;
                }
              }

              const oldestRun = previousRuns[previousRuns.length - 1];
              if (
                previousRuns.length < 100 ||
                !oldestRun ||
                Date.parse(oldestRun.created_at) < retentionCutoff
              ) {
                break;
              }
            }

            core.setOutput("has_previous_runtime", hasPreviousRuntime ? "true" : "false");
            core.setOutput("run_id", selectedRun ? String(selectedRun.id) : "");
            if (!selectedRun && hasPreviousRuntime) {
              core.warning("Previous runtime runs exist, but none has a usable encrypted Strix history artifact.");
            }

      - name: Restore legacy encrypted Strix run snapshot (fallback only)
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ares-strix-state
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ares-state

      - name: Report legacy artifact availability
        if: steps.previous.outputs.run_id != ''
        shell: bash
        run: |
          if [ -s ares-state/strix-runs.enc ]; then
            echo "Legacy Actions artifact is available as a fallback."
          else
            echo "::warning::Legacy artifact unavailable; ARES will try durable repository storage."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ARES and Strix
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify Docker runtime
        run: docker info

      - name: Validate required configuration
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "Missing repository secret TELEGRAM_BOT_TOKEN" && exit 1)
          test -n "$ADMIN_ID" || (echo "Missing repository secret ADMIN_ID" && exit 1)
          test -n "$GITHUB_TOKEN" || (echo "GitHub Actions token is unavailable" && exit 1)

      - name: Run ARES Telegram interface
        env:
          ARES_PREVIOUS_RUNTIME_EXISTS: ${{ steps.previous.outputs.has_previous_runtime }}
        run: python -m ares

      - name: Save encrypted Strix run state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ares-strix-state
          path: ares-state/strix-runs.enc
          if-no-files-found: ignore
          retention-days: 30
